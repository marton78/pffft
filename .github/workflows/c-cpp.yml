name: C/C++ CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # cmake options shared by the jobs below, expanded unquoted: no value may
  # contain a space. Where the benchmarks are built, leave out the
  # third-party FFTs they compare to, submodules CI does not check out:
  NO_BENCH_FFTS: -DPFFFT_USE_BENCH_GREEN=OFF -DPFFFT_USE_BENCH_KISS=OFF -DPFFFT_USE_BENCH_POCKET=OFF -DPFFFT_USE_BENCH_OOURA=OFF
  # build the tests, but not the benchmarks or the examples:
  TESTS_ONLY: -DPFFFT_BUILD_TESTS=ON -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF

jobs:
  build_emscripten:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - uses: emscripten-core/setup-emsdk@v16
    - name: cmake configure
      run: emcmake cmake -S . -B build_wasm -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CROSSCOMPILING_EMULATOR=node $TESTS_ONLY
    - name: build
      run: cmake --build build_wasm
    - name: test
      run: ctest --test-dir build_wasm --output-on-failure

  # 64-bit RISC-V, cross-compiled and run under qemu. TARGET_C_ARCH=none, the
  # default, must leave -march to the toolchain, as on every other target, so
  # the build runs wherever the toolchain's code runs. TARGET_C_ARCH=auto
  # enables the vector extension, V, if the build machine has it. qemu takes
  # its CPU model from QEMU_CPU: build_cpu is the machine the configure-time
  # probe runs on, test_cpu the one the tests run on, so a binary built on a
  # machine with V can be run on one without it.
  build_riscv64_qemu:
    name: riscv64 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04's gcc 15 targets the RVA23 profile, which has V
          - name: RVA23 toolchain, default
            os: ubuntu-26.04
            gcc: ""
            arch: none
            build_cpu: rva23u64,vlen=256
            test_cpu: rva23u64,vlen=256
            backend: RVV
            march: ""
          - name: RVA23 toolchain, auto
            os: ubuntu-26.04
            gcc: ""
            arch: auto
            build_cpu: rva23u64,vlen=256
            test_cpu: rva23u64,vlen=256
            backend: RVV
            march: ""
          # Ubuntu 24.04's gcc 14 targets rv64gc, without V. Its default,
          # gcc 13, compiles the RVV backend to scalar code (see below).
          - name: rv64gc toolchain, default, built with V, run without
            os: ubuntu-24.04
            gcc: "-14"
            arch: none
            build_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            test_cpu: rv64,v=false
            backend: 4xScalar
            march: ""
          - name: rv64gc toolchain, auto, with V
            os: ubuntu-24.04
            gcc: "-14"
            arch: auto
            build_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            test_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            backend: RVV
            march: rv64gcv
          - name: rv64gc toolchain, auto, without V
            os: ubuntu-24.04
            gcc: "-14"
            arch: auto
            build_cpu: rv64,v=false
            test_cpu: rv64,v=false
            backend: 4xScalar
            march: ""
          # no emulator: nothing to probe, and nothing to run the tests on
          - name: rv64gc toolchain, auto, no emulator
            os: ubuntu-24.04
            gcc: "-14"
            arch: auto
            build_cpu: ""
            test_cpu: ""
            backend: 4xScalar
            march: ""
          # gcc 13 selects the RVV backend but emits scalar code for it, which
          # cmake must report, with a warning
          - name: gcc 13, rv64gcv
            os: ubuntu-24.04
            gcc: "-13"
            arch: rv64gcv
            build_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            test_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            backend: RVV (scalar code)
            march: rv64gcv
    env:
      GCC: ${{ matrix.gcc }}
      ARCH: ${{ matrix.arch }}
      BUILD_CPU: ${{ matrix.build_cpu }}
      TEST_CPU: ${{ matrix.test_cpu }}
      BACKEND: ${{ matrix.backend }}
      MARCH: ${{ matrix.march }}
      # cmake options for the cross toolchain, and for qemu to run what it
      # builds, expanded unquoted below: no value may contain a space
      CROSS: >-
        -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=riscv64
        -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc${{ matrix.gcc }}
        -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++${{ matrix.gcc }}
        -DCMAKE_FIND_ROOT_PATH=/usr/riscv64-linux-gnu
      EMULATOR: "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-riscv64;-L;/usr/riscv64-linux-gnu"

    steps:
    - uses: actions/checkout@v7
    - name: install riscv64 cross toolchain and qemu
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc$GCC-riscv64-linux-gnu g++$GCC-riscv64-linux-gnu qemu-user
    - name: cmake configure
      run: |
        set -o pipefail
        # the emulator only with a CPU for it to emulate
        QEMU_CPU="$BUILD_CPU" cmake -S . -B build_riscv64 $CROSS ${BUILD_CPU:+$EMULATOR} \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DTARGET_C_ARCH=$ARCH -DTARGET_CXX_ARCH=$ARCH \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON $TESTS_ONLY \
          2>&1 | tee configure_riscv64.log
    - name: build
      run: cmake --build build_riscv64
    - name: test
      if: matrix.test_cpu != ''
      run: QEMU_CPU="$TEST_CPU" ctest --test-dir build_riscv64 --output-on-failure
    - name: check the backend and -march
      run: bash .github/scripts/check-riscv64-build.sh build_riscv64 configure_riscv64.log
    # auto chooses the -march itself, so a -march in the compiler flags as
    # well is a contradiction, which configuring must reject
    - name: TARGET_C_ARCH=auto rejects a -march in the flags
      if: matrix.arch == 'auto'
      run: |
        configure() {  # <cmake options>
          rm -rf build_conflict
          cmake -S . -B build_conflict $CROSS -DCMAKE_BUILD_TYPE=$BUILD_TYPE "$@" > conflict.log 2>&1
        }
        expect_conflict() {  # <C|CXX> <cmake option>
          if configure -DTARGET_C_ARCH=auto -DTARGET_CXX_ARCH=auto "$2"; then
            echo "::error::configuring with TARGET_$1_ARCH=auto and $2 succeeded"; exit 1
          fi
          # cmake wraps the lines of an error
          tr -s ' \n' '  ' < conflict.log | grep -q "TARGET_$1_ARCH=auto conflicts with -march=rv64gc_zba" \
            || { cat conflict.log; echo "::error::expected an error about TARGET_$1_ARCH=auto and $2"; exit 1; }
          echo "rejected, as expected: TARGET_$1_ARCH=auto with $2"
        }
        expect_conflict C "-DCMAKE_C_FLAGS_${BUILD_TYPE^^}=-O3 -march=rv64gc_zba"
        # quoted, as the shell would take it
        expect_conflict C "-DCMAKE_C_FLAGS_${BUILD_TYPE^^}=-O3 '-march=rv64gc_zba'"
        expect_conflict CXX "-DCMAKE_CXX_FLAGS=-march=rv64gc_zba"
        # a project's compile options for C++ only: a conflict for C++, not for C
        echo 'add_compile_options("$<$<COMPILE_LANGUAGE:CXX>:-march=rv64gc_zba>")' > cxx_march.cmake
        expect_conflict CXX "-DCMAKE_PROJECT_INCLUDE=$PWD/cxx_march.cmake"
        configure -DTARGET_C_ARCH=auto -DTARGET_CXX_ARCH=none "-DCMAKE_PROJECT_INCLUDE=$PWD/cxx_march.cmake" \
          || { cat conflict.log; echo "::error::a -march for C++ only blocked TARGET_C_ARCH=auto"; exit 1; }
        echo "accepted, as expected: TARGET_C_ARCH=auto with a -march for C++ only"
        # an option group, and an option for the build type being built
        echo 'add_compile_options("SHELL:-O2 -march=rv64gc_zba")' > shell_march.cmake
        expect_conflict C "-DCMAKE_PROJECT_INCLUDE=$PWD/shell_march.cmake"
        echo 'add_compile_options("$<$<CONFIG:'$BUILD_TYPE'>:-march=rv64gc_zba>")' > config_march.cmake
        expect_conflict C "-DCMAKE_PROJECT_INCLUDE=$PWD/config_march.cmake"
    # The rest needs auto to add an -march, which it does where the probe
    # finds V and the compiler doesn't enable it already.
    # auto caches what its CPU probe found, but not a probe that failed to
    # build: once the flags that broke it are fixed, it must probe again.
    - name: TARGET_C_ARCH=auto probes again when the flags change
      if: matrix.arch == 'auto' && matrix.march != ''
      run: |
        configure() {  # <cmake options>
          QEMU_CPU="$BUILD_CPU" cmake -S . -B build_reprobe $CROSS $EMULATOR \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DTARGET_C_ARCH=auto -DTARGET_CXX_ARCH=auto \
            "$@" > reprobe.log 2>&1 \
            || { cat reprobe.log; exit 1; }
          grep "TARGET_C_ARCH=auto for target PFFFT" reprobe.log
        }
        expect() {  # <-march or "the compiler's default"> <error>
          grep -q "TARGET_C_ARCH=auto for target PFFFT: $1" reprobe.log || { echo "::error::$2"; exit 1; }
        }
        # without the C library the probe cannot link, through the compiler
        # flags, then through the linker flags
        configure "-DCMAKE_C_FLAGS_${BUILD_TYPE^^}=-O3 -DNDEBUG -nostdlib"
        expect "the compiler's default" "the probe was expected to fail"
        configure "-DCMAKE_C_FLAGS_${BUILD_TYPE^^}=-O3 -DNDEBUG" -DCMAKE_EXE_LINKER_FLAGS=-nostdlib
        expect "the compiler's default" "the probe was expected to fail"
        # the same build directory with working flags must probe again
        configure -DCMAKE_EXE_LINKER_FLAGS=
        expect "-march=$MARCH" "auto kept the failed probe's result"
    # an -march that auto cannot recognise, here in a generator expression it
    # does not evaluate, must still win over auto's own
    - name: TARGET_C_ARCH=auto yields to a -march it cannot see
      if: matrix.arch == 'auto' && matrix.march != ''
      run: |
        echo 'add_compile_options("$<$<AND:$<CONFIG:'$BUILD_TYPE'>,$<COMPILE_LANGUAGE:C>>:-march=rv64gc_zba>")' > hidden_march.cmake
        QEMU_CPU="$BUILD_CPU" cmake -S . -B build_hidden $CROSS $EMULATOR \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DTARGET_C_ARCH=auto -DTARGET_CXX_ARCH=none \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          "-DCMAKE_PROJECT_INCLUDE=$PWD/hidden_march.cmake" > hidden.log 2>&1 \
          || { cat hidden.log; exit 1; }
        # the last -march on pffft.c's command line is the one the compiler uses
        last=$(grep -o '"command": "[^"]*/pffft\.c' build_hidden/compile_commands.json | grep -o -- '-march=[^ ]*' | tail -1)
        echo "last -march for pffft.c: $last"
        [ "$last" = "-march=rv64gc_zba" ] || { echo "::error::auto's -march overrode the project's"; exit 1; }
        # so the library has no vector code, and the backend probe, which saw
        # auto's -march but not the project's, must not claim RVV unqualified
        cmake --build build_hidden --target PFFFT
        bash .github/scripts/check-rvv-code.sh build_hidden/libpffft.a none
        tr -s ' \n' '  ' < hidden.log | grep -o "Detected SIMD backend for PFFFT: [^-]*-[^ ]*" || true
        tr -s ' \n' '  ' < hidden.log | grep -q "Detected SIMD backend for PFFFT: .*not counting the machine options in generator expressions" \
          || { echo "::error::the backend report does not say it could not see the project's -march"; exit 1; }
    # a multi-config build reports the backend of one configuration, Debug
    # unless CMAKE_TRY_COMPILE_CONFIGURATION says otherwise; an option for
    # another configuration must not count
    - name: the backend report follows the configuration it probes
      if: matrix.arch == 'none' && matrix.gcc == '-14'
      run: |
        sudo apt-get install -y ninja-build
        echo 'add_compile_options("$<$<CONFIG:Release>:-march=rv64gcv>")' > release_v.cmake
        report() {  # <cmake options>
          rm -rf build_multi
          cmake -S . -B build_multi -G "Ninja Multi-Config" $CROSS \
            -DPFFFT_BUILD_TESTS=OFF -DPFFFT_BUILD_BENCHMARKS=OFF -DPFFFT_BUILD_EXAMPLES=OFF \
            "-DCMAKE_PROJECT_INCLUDE=$PWD/release_v.cmake" "$@" > multi.log 2>&1 \
            || { cat multi.log; exit 1; }
          grep "Detected SIMD backend for PFFFT" multi.log
        }
        report
        grep -qF "float: 4xScalar, double: 4xScalar (Debug configuration)" multi.log \
          || { echo "::error::the Debug report counted a Release-only -march"; exit 1; }
        report -DCMAKE_TRY_COMPILE_CONFIGURATION=Release
        grep -qF "float: RVV, double: RVV (Release configuration)" multi.log \
          || { echo "::error::the Release report missed its -march"; exit 1; }

  # The same, built natively: a riscv64 container that qemu runs through
  # binfmt_misc, CPU model from QEMU_CPU as above. CMake does not
  # cross-compile here, so TARGET_C_ARCH=auto also adds zvlNNNb for the VLEN
  # of the build machine, which it leaves out under an emulator.
  build_riscv64_native_qemu:
    name: riscv64 native (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default, built with V, run without
            arch: none
            build_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            test_cpu: rv64,v=false
            backend: 4xScalar
            march: ""
          - name: auto, VLEN 256
            arch: auto
            build_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            test_cpu: rv64,v=true,vlen=256,vext_spec=v1.0
            backend: RVV
            march: rv64gcv_zvl256b
          - name: auto, VLEN 128
            arch: auto
            build_cpu: rv64,v=true,vlen=128,vext_spec=v1.0
            test_cpu: rv64,v=true,vlen=128,vext_spec=v1.0
            backend: RVV
            march: rv64gcv
    env:
      ARCH: ${{ matrix.arch }}
      BUILD_CPU: ${{ matrix.build_cpu }}
      TEST_CPU: ${{ matrix.test_cpu }}
      BACKEND: ${{ matrix.backend }}
      MARCH: ${{ matrix.march }}

    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: riscv64
    - name: configure, build, test and check in a riscv64 container
      run: |
        # Ubuntu 24.04 targets rv64gc, so its programs run on either CPU model;
        # gcc 14, as gcc 13 compiles the RVV backend to scalar code
        docker run --rm --platform linux/riscv64 -v "$PWD:/src" -w /src \
          -e BUILD_TYPE -e TESTS_ONLY \
          -e ARCH -e BUILD_CPU -e TEST_CPU -e BACKEND -e MARCH \
          ubuntu:24.04 bash -c '
            set -eo pipefail
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -yqq install gcc-14 g++-14 cmake make binutils >/dev/null
            export QEMU_CPU="$BUILD_CPU"
            cmake -S . -B build_riscv64 \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
              -DTARGET_C_ARCH=$ARCH -DTARGET_CXX_ARCH=$ARCH \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON $TESTS_ONLY \
              2>&1 | tee configure_riscv64.log
            cmake --build build_riscv64 -j $(nproc)
            QEMU_CPU="$TEST_CPU" ctest --test-dir build_riscv64 --output-on-failure
            OBJDUMP=objdump bash .github/scripts/check-riscv64-build.sh build_riscv64 configure_riscv64.log
          '

  build_cortex_m55_qemu:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: install arm-none-eabi toolchain and qemu
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm
    - name: cmake configure
      run: |
        set -o pipefail
        cmake -S . -B build_m55 \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_TOOLCHAIN_FILE=tests/cortex-m55/toolchain.cmake \
          -DPFFFT_USE_HELIUM=ON $TESTS_ONLY \
          | tee configure_m55.log
        # fail unless the Helium backend is selected
        grep -q "SIMD backend for PFFFT: float: Helium, double: 4xScalar" configure_m55.log
    - name: build
      run: cmake --build build_m55
    - name: test
      # the bench_* tests allocate about 1 GiB
      run: ctest --test-dir build_m55 --output-on-failure -E "^bench_"

  # Linux and macOS, natively
  build_unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    env:
      BUILDS: build_simd_full build_simd_float build_simd_double build_no-simd_full build_no-simd_scalar_full build_no-simd_novect

    steps:
    - uses: actions/checkout@v7
    - name: build
      run: |
        build() {  # <build dir> <cmake options>
          echo "::group::$1"
          cmake -S . -B "$1" -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS \
            -DTARGET_C_ARCH=native -DTARGET_CXX_ARCH=native "${@:2}"
          cmake --build "$1"
          echo "::endgroup::"
        }
        build build_simd_full
        build build_simd_float -DPFFFT_USE_TYPE_DOUBLE=OFF
        build build_simd_double -DPFFFT_USE_TYPE_FLOAT=OFF
        build build_no-simd_full -DPFFFT_USE_SIMD=OFF
        build build_no-simd_scalar_full -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=ON
        # the only configuration that compiles the SIMD_SZ==1 nosimd code
        build build_no-simd_novect -DPFFFT_USE_SIMD=OFF -DPFFFT_USE_SCALAR_VECT=OFF
    - name: test
      run: |
        for d in $BUILDS; do
          echo "::group::$d"
          ctest --test-dir $d --output-on-failure
          echo "::endgroup::"
        done

  cross_build_win_from_linux:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: prerequisites
      run: sudo apt-get -qq update && sudo apt-get -yqq install gcc-mingw-w64 g++-mingw-w64
    - name: build_w32_no-simd
      run: bash ./cross_build_mingw.sh w32 no-simd -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS -DPFFFT_USE_SIMD=OFF
    - name: build_w32_simd_full
      run: bash ./cross_build_mingw.sh w32 simd_full -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS -DTARGET_C_ARCH=pentium4 -DTARGET_CXX_ARCH=pentium4
    - name: build_w64_no-simd
      run: bash ./cross_build_mingw.sh w64 no-simd -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS -DPFFFT_USE_SIMD=OFF
    - name: build_w64_simd_full
      run: bash ./cross_build_mingw.sh w64 simd_full -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS -DTARGET_C_ARCH=sandybridge -DTARGET_CXX_ARCH=sandybridge
    # On Windows a shared library is two files: the DLL, a RUNTIME artifact
    # that belongs in bin/, and its import library, an ARCHIVE in lib/.
    # Install both, and check that the exported CMake package points at the DLL.
    - name: build_w64_shared and install
      run: |
        bash ./cross_build_mingw.sh w64 shared -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS -DBUILD_SHARED_LIBS=ON -DINSTALL_PFFASTCONV=ON
        cmake --install build_w64_shared --prefix "$PWD/install_w64_shared"
        find install_w64_shared -type f | sort
        for lib in pffft pffastconv; do
          test -f install_w64_shared/bin/lib$lib.dll || { echo "::error::lib$lib.dll was not installed to bin/"; exit 1; }
          test -f install_w64_shared/lib/lib$lib.dll.a || { echo "::error::lib$lib.dll.a was not installed to lib/"; exit 1; }
        done
        grep -q 'bin/libpffft\.dll' install_w64_shared/lib/cmake/pffft/pffft-targets-*.cmake \
          || { echo "::error::the exported targets do not locate libpffft.dll"; exit 1; }

  build_win_msvc:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: bash
    env:
      BUILDS: build_no-simd build_sse2 build_avx build_avx2

    steps:
    - uses: actions/checkout@v7
    - name: configure and build
      run: |
        build() {  # <build dir> <TARGET_C_ARCH and TARGET_CXX_ARCH> <cmake options>
          echo "::group::$1"
          cmake -S . -B "$1" -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            $NO_BENCH_FFTS -DTARGET_C_ARCH=$2 -DTARGET_CXX_ARCH=$2 "${@:3}"
          cmake --build "$1" --config $BUILD_TYPE
          echo "::endgroup::"
        }
        build build_no-simd none -DPFFFT_USE_SIMD=OFF
        build build_sse2 SSE2
        build build_avx AVX
        build build_avx2 AVX2
    - name: test
      run: for d in $BUILDS; do ctest --test-dir $d -C $BUILD_TYPE --output-on-failure; done

  # MSVC for ARM, natively, and from an x64 host, where CMAKE_SYSTEM_PROCESSOR
  # is the host's "AMD64" and the target comes from the compiler
  build_win_msvc_arm64:
    name: MSVC ${{ matrix.platform }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            platform: ARM64
            backend: NEON
            test: true
          - os: windows-2025-vs2026
            platform: ARM64
            backend: NEON
          # ARM64EC defines neither _M_ARM64 nor __ARM_NEON, and the SSE headers
          # exclude _M_ARM64EC, so both backends are scalar
          - os: windows-2025-vs2026
            platform: ARM64EC
            backend: 4xScalar
    defaults:
      run:
        shell: bash
    env:
      # not PLATFORM, which MSBuild would take for its Platform property
      VS_PLATFORM: ${{ matrix.platform }}
      BACKEND: ${{ matrix.backend }}

    steps:
    - uses: actions/checkout@v7
    - name: configure
      run: |
        cmake -S . -B build -G "Visual Studio 18 2026" -A $VS_PLATFORM -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS | tee configure.log
        grep -qF "Detected SIMD backend for PFFFT: float: $BACKEND, double: $BACKEND" configure.log \
          || { echo "::error::expected the $BACKEND backend"; exit 1; }
        if grep -q "has no FMA" configure.log; then echo "::error::$VS_PLATFORM treated as x86"; exit 1; fi
    - name: build
      run: cmake --build build --config $BUILD_TYPE
    - name: test
      if: matrix.test
      run: ctest --test-dir build -C $BUILD_TYPE --output-on-failure

  build_win_mingw:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        pacboy: >-
          gcc:p
          cmake:p
          make:p
    - name: configure
      run: CC=gcc cmake -S . -B build_mgw64 -DMINGW=ON -DCMAKE_BUILD_TYPE=$BUILD_TYPE $NO_BENCH_FFTS -DTARGET_C_ARCH=native -DTARGET_CXX_ARCH=native
    - name: build
      run: cmake --build build_mgw64
    - name: test
      run: ctest --test-dir build_mgw64 --output-on-failure
